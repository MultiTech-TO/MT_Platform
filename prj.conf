CONFIG_ARM_MPU=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SPI_NOR=n

CONFIG_LOG=y
CONFIG_LORA=y
