name: Action test

on:
  push:
  pull_request:

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: 
          submodules: false
          
      - name: Setup Submodule SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BOARD_REPO_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          
      - name: Init and update submodules
        run: |
          git submodule sync
          git submodule update --init --recursive
        
      - name: Main Zephyr repository checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: zephyrproject-rtos/zephyr
          path: zephyr
          ref: v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: .
          toolchains: arm-zephyr-eabi
          west-group-filter: -tools,-bootloader,-babblesim
          west-project-filter: -nrf_hw_models
          west-version: 1.5.0
          
      - name: Fetch hal_silabs
        run: |
          west blobs fetch hal_silabs
          
      - name: Build
        run: |
          source ./zephyr/zephyr-env.sh
          west build . --board swt_043a_01 -DBOARD_ROOT=MT_Platform_Boards
