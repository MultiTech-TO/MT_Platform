name: Action test

on:
  push:
  pull_request:

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Generate Short-Lived Token from App
        id: app_token
        uses: actions/create-github-app-token@v3 # Use a trusted action
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # The repositories the token needs access to
          repositories: 'MT_Platform, MT_Platform_Boards'
          
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app_token.outputs.token }}
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
        
      - name: Main Zephyr repository checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: zephyrproject-rtos/zephyr
          path: zephyr
          ref: v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: .
          toolchains: arm-zephyr-eabi
          west-group-filter: -tools,-bootloader,-babblesim
          west-project-filter: -nrf_hw_models
          west-version: 1.5.0
          
      - name: Fetch hal_silabs
        run: |
          west blobs fetch hal_silabs
          
      - name: Build
        run: |
          printenv
          west build . --board swt_043a_01 -DBOARD_ROOT=MT_Platform_Boards
